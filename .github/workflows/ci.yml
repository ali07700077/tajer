name: TAJER CI
on:
  push:
    branches:
      - implementation/bootstrap
  pull_request:
    branches:
      - main
      - implementation/bootstrap
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare Supabase environment
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret VITE_SUPABASE_URL"
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing GitHub Actions secret VITE_SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          {
            printf 'VITE_SUPABASE_URL=%s\\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\\n' "$VITE_SUPABASE_PUBLISHABLE_KEY"
          } > .env.production
      - name: Typecheck and production build
        run: npm run build
