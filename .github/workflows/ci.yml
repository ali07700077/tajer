name: TAJER CI
on:
  push:
    branches:
      - implementation/bootstrap
      - fix/db-migrations-rls
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - implementation/bootstrap

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start isolated local Supabase
        run: |
          if ! supabase start > /tmp/supabase-start.log 2>&1; then
            echo "::group::Supabase startup log"
            cat /tmp/supabase-start.log || true
            echo "::endgroup::"
            echo "::group::Docker diagnostics"
            docker version || true
            docker info || true
            docker ps -a || true
            df -h || true
            echo "::endgroup::"
            exit 1
          fi
          supabase db reset
          supabase status -o json > /tmp/supabase-status.json
          node <<'NODE'
          const fs = require("node:fs");
          const raw = JSON.parse(fs.readFileSync("/tmp/supabase-status.json", "utf8"));
          const values = {};
          function collect(value) {
            if (Array.isArray(value)) return value.forEach(collect);
            if (!value || typeof value !== "object") return;
            for (const [key, item] of Object.entries(value)) {
              if (typeof item === "string") values[key.toUpperCase()] = item;
              else collect(item);
            }
          }
          collect(raw);
          const apiUrl = values.API_URL || values.SUPABASE_URL;
          const anonKey = values.ANON_KEY || values.PUBLISHABLE_KEY || values.SUPABASE_ANON_KEY;
          const serviceKey = values.SERVICE_ROLE_KEY || values.SECRET_KEY || values.SUPABASE_SERVICE_ROLE_KEY;
          if (!apiUrl || !(apiUrl.startsWith("http://") || apiUrl.startsWith("https://")) || !anonKey || !serviceKey) {
            throw new Error("Supabase CLI JSON status is missing API_URL, ANON_KEY/PUBLISHABLE_KEY, or SERVICE_ROLE_KEY/SECRET_KEY");
          }
          for (const [key, value] of Object.entries(values)) {
            if (/(KEY|SECRET|TOKEN|PASSWORD|DB_URL)/.test(key) && value) console.log("::add-mask::" + value);
          }
          for (const secret of [anonKey, serviceKey]) console.log("::add-mask::" + secret);
          fs.appendFileSync(process.env.GITHUB_ENV, [
            "SUPABASE_URL=" + apiUrl,
            "SUPABASE_ANON_KEY=" + anonKey,
            "SUPABASE_SERVICE_ROLE_KEY=" + serviceKey,
            ""
          ].join("\n"));
          NODE

      - name: Wait for Supabase API health
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail --max-time 5 "$SUPABASE_URL/auth/v1/health" >/dev/null; then
              echo "Supabase Auth API is healthy."
              exit 0
            fi
            echo "Waiting for Supabase API (attempt $attempt/60)..."
            sleep 2
          done
          echo "Supabase API did not become healthy in time."
          exit 1

      - name: Run database unit and RLS tests
        run: supabase test db

      - name: Run tenant isolation and RFQ lifecycle tests
        run: npm run test:e2e
