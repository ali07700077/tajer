name: TAJER CI
on:
  push:
    branches:
      - implementation/bootstrap
  pull_request:
    branches:
      - main
      - implementation/bootstrap

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Supabase configuration is optional at build time.
      # The browser client stays disabled until a real public URL/key is configured.
      - name: TypeScript check (temporary non-blocking)
        run: npm run typecheck
        continue-on-error: true

      - name: Production build
        run: npm run build
