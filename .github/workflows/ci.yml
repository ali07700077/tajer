name: TAJER CI
on:
  push:
    branches:
      - implementation/bootstrap
  pull_request:
    branches:
      - main
      - implementation/bootstrap

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # TypeScript is a required gate. tsconfig.json already enables strict mode.
      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
